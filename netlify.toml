# Static deployment of the DDISA directory (Supabase-backed front-end).
#
# Set these two environment variables in Netlify (Site settings >
# Environment variables) — the build injects them into netlify/config.js:
#   SUPABASE_URL       https://<project>.supabase.co   (Settings > API)
#   SUPABASE_ANON_KEY  the anon/public key             (Settings > API)
#
# Alternatively edit netlify/config.js by hand before dragging the netlify/
# folder into Netlify. Never set the service-role key here.

[build]
  command = "npm run build:netlify"
  publish = "netlify"

[build.environment]
  NODE_VERSION = "24"

# Server-side write flows (grantee sign-in, submissions, collaboration
# requests). Functions read SUPABASE_URL, SUPABASE_ANON_KEY and
# SUPABASE_SERVICE_ROLE_KEY from the site environment — never from the browser.
[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Standalone organisation profile pages (/org/<slug>) are rendered
# client-side from index.html. Non-forced rewrite: existing files (assets,
# config.js, functions) are still served before this applies.
[[redirects]]
  from = "/org*"
  to = "/index.html"
  status = 200

# Support Desk: the page route serves the static shell, and the form posts
# to its Netlify Function through this same-origin rewrite.
[[redirects]]
  from = "/support-desk"
  to = "/support-desk.html"
  status = 200

[[redirects]]
  from = "/api/support-requests"
  to = "/.netlify/functions/support-requests"
  status = 200
